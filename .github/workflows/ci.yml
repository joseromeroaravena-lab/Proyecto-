name: CI

on:
  push:
    branches:
      - 'feature/**'
      - '[0-9]+-feature_**'
      - beta
      - master
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-flow:
    name: Branch flow to ${{ github.base_ref }}
    if: github.event_name == 'pull_request' && (github.base_ref == 'beta' || github.base_ref == 'master')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Validate pull request source
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          case "$TARGET_BRANCH" in
            beta)
              if [[ "$SOURCE_BRANCH" =~ ^([0-9]+-feature_|feature/).+$ ]]; then
                exit 0
              fi
              echo "::error::Abre el PR a beta desde una rama feature/<nombre> o <n>-feature_<nombre>."
              ;;
            master)
              if [[ "$SOURCE_BRANCH" == beta && "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                exit 0
              fi
              echo "::error::Abre el PR a master desde beta de este repositorio."
              ;;
          esac
          exit 1
      - name: Require successful CI on beta for this commit
        if: github.base_ref == 'master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..10}; do
            result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f branch=beta -f event=push -f head_sha="$BETA_SHA" -F per_page=1 \
              --jq '.workflow_runs[0] | .conclusion // .status // "missing"')
            case "$result" in
              success)
                echo "El CI de beta aprobó el commit $BETA_SHA."
                exit 0
                ;;
              missing|queued|in_progress|requested|waiting|pending)
                if [[ "$attempt" -lt 10 ]]; then
                  sleep 30
                fi
                ;;
              *)
                echo "::error::El CI de beta para $BETA_SHA terminó con estado $result."
                exit 1
                ;;
            esac
          done
          echo "::error::El CI de beta para $BETA_SHA aún no ha aprobado. Cuando termine, vuelve a ejecutar este check."
          exit 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --select E4,E7,E9,F .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    name: Build verification
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q *.py
